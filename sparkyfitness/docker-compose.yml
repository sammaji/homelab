services:
  sparkyfitness-db:
    image: postgres:18-alpine
    container_name: hlab-sparkyfitness-db
    restart: unless-stopped
    environment:
      # Read only on first init. Changing them later breaks auth; ALTER the role instead.
      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME:-sparkyfitness_db}
      POSTGRES_USER: ${SPARKY_FITNESS_DB_USER:-sparky}
      POSTGRES_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?environment variable SPARKY_FITNESS_DB_PASSWORD is not set.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sparkyfitness-db-data:/var/lib/postgresql
    networks:
      - sparkyfitness-net

  sparkyfitness-server:
    image: codewithcj/sparkyfitness_server:latest
    container_name: hlab-sparkyfitness-server
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: ${SPARKY_FITNESS_DB_NAME:-sparkyfitness_db}
      SPARKY_FITNESS_DB_USER: ${SPARKY_FITNESS_DB_USER:-sparky}
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?environment variable SPARKY_FITNESS_DB_PASSWORD is not set.}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:-https://fitness.sammaji.com}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY:?environment variable SPARKY_FITNESS_API_ENCRYPTION_KEY is not set.}
      BETTER_AUTH_SECRET: ${SPARKY_FITNESS_BETTER_AUTH_SECRET:?environment variable SPARKY_FITNESS_BETTER_AUTH_SECRET is not set.}

      NODE_ENV: production
      TZ: Asia/Kolkata
      SPARKY_FITNESS_LOG_LEVEL: ERROR
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_SHUTDOWN_TIMEOUT_SECONDS: 15
      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKY_FITNESS_DISABLE_SIGNUP:-false}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:-}
      SPARKY_FITNESS_TRUSTED_PROXY_HOPS: 2
    depends_on:
      sparkyfitness-db:
        condition: service_healthy
    volumes:
      - sparkyfitness-backup:/app/SparkyFitnessServer/backup
      - sparkyfitness-uploads:/app/SparkyFitnessServer/uploads
    networks:
      - sparkyfitness-net

  sparkyfitness-frontend:
    image: codewithcj/sparkyfitness:latest
    container_name: hlab-sparkyfitness-frontend
    restart: unless-stopped
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:-https://fitness.sammaji.com}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
      NGINX_LISTEN_PORT: 80
    depends_on:
      - sparkyfitness-server
    ports:
      - 127.0.0.1:5070:80
    networks:
      - sparkyfitness-net

volumes:
  sparkyfitness-db-data:
    name: hlab-sparkyfitness-db-data
  sparkyfitness-backup:
    name: hlab-sparkyfitness-backup
  sparkyfitness-uploads:
    name: hlab-sparkyfitness-uploads

networks:
  sparkyfitness-net:
    name: hlab-sparkyfitness-net
    driver: bridge

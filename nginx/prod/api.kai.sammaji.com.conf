# ----------------------------------------------------------------------
# HTTP to HTTPS REDIRECT
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.kai.sammaji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS CONFIGURATION
# ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kai.sammaji.com;

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    ssl_certificate /etc/letsencrypt/live/api.kai.sammaji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kai.sammaji.com/privkey.pem;
}

# ----------------------------------------------------------------------
# HTTP to HTTPS REDIRECT
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zulip.sammaji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS CONFIGURATION
# ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zulip.sammaji.com;

    ssl_certificate     /etc/letsencrypt/live/zulip.sammaji.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zulip.sammaji.com/privkey.pem; # managed by Certbot

    # Zulip's real-time events endpoint long-polls; uploads/exports can be large
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5650;
        include /etc/nginx/snippets/proxy-headers.conf;

        proxy_buffering    off;
        proxy_read_timeout 20m;
    }
}

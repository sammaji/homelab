# Catch-all for HTTPS requests whose SNI/Host matches no vhost (IP scans, stray
# domains): refuse the TLS handshake instead of falling through to the first vhost,
# which would hand out its certificate and serve its public paths. Port 80 is left to
# Ubuntu's stock `default` site, which nginx-link keeps.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ----------------------------------------------------------------------
# HTTP to HTTPS REDIRECT
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fitness.sammaji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS CONFIGURATION
# ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitness.sammaji.com;

    ssl_certificate     /etc/letsencrypt/live/fitness.sammaji.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fitness.sammaji.com/privkey.pem; # managed by Certbot

    # Profile/exercise photos and backup restores exceed nginx's 1m default.
    client_max_body_size 50m;

    # SparkyFitness (frontend nginx proxies /api etc. to the server) - tailnet-only.
    location / {
        include /etc/nginx/snippets/tailnet-only.conf;
        proxy_pass http://127.0.0.1:5070;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
